# @dsh-tui/dsh-tui over @deepseek-ai/dsh-base.
# dsh-base already mounts storage, storage-json, storage-domain, and
# session-projection-cache. Loader rejects duplicate inserts for those ids.

- id: agent-loop
  inject: [tuiStartup]
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-pro
        cwd: !!js process.cwd()

- id: system-prompt
  config:
    persona: |
      You are a coding agent powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: max

- insert:
    - id: tui-startup
      name: '@dsh-tui/dsh-tui/startup'

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: tmux-context
      name: '@deepseek-ai/dsh-tmux-context'
      config:
        refreshIntervalMs: 900000

    - id: tui-prompt
      name: '@dsh-tui/dsh-tui/prompt'

    - id: tui
      name: '@dsh-tui/dsh-tui'
      inject: [tuiStartup]
      config:
        sessionId: !!js ctx.tuiStartup.sessionId
        showReasoning: true
        maxToolOutputLines: 6

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    - id: tui-providers
      name: '@dsh-tui/providers'
      inject: [commands, settings, credentials, authorization, llm]

    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
